[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-match-avangard"
version = "0.1.0"
description = "Ticket demand forecasting for DATA MATCH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.1",
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 90
target-version = ['py310']
extend-exclude = '''
(
  migrations   # Django DB migrations
)
'''
